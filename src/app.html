<!doctype html>
<html lang="en" data-loading="">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#034102" />
		<link rel="preload" href="/assets/preloader-image.svg" as="image" fetchpriority="high" />
		<link rel="preload" href="/assets/paper-overlay.webp" as="image" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Nothing+You+Could+Do&family=Sofia+Sans+Condensed:wght@700;800;900&display=swap"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<noscript>
			<style>
				.site-preloader {
					display: none;
				}
				html[data-loading] {
					overflow: visible;
				}
				.hero-section .char {
					transform: none;
				}
				.hero-section .corner-perf {
					clip-path: none;
				}
			</style>
		</noscript>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
