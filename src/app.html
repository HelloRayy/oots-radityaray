<!doctype html>
<html lang="en" data-loading="">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#034102" />
		<link rel="preload" href="/assets/preloader-image.svg" as="image" fetchpriority="high" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<noscript>
			<style>
				.site-preloader {
					display: none;
				}
				html[data-loading] {
					overflow: visible;
				}
			</style>
		</noscript>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
